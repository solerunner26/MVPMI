name: Quality checks
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      community_url:
        description: "HTTPS backend URL for a phone-test APK (blank uses repository variable/default)"
        required: false
        type: string
permissions:
  contents: read
jobs:
  server-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run test:ui
      - run: npm run test:lock
      - run: npm run test:embedded
      - run: npm run test:accessibility
      - run: npm run test:language
      - run: npm run test:materials
      - run: npm run test:village
      - run: npm audit --audit-level=moderate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-quality-results
          path: test-results/
          retention-days: 7
  android:
    # Never package an app from code whose server/browser checks failed.
    needs: server-and-browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMMUNITY_URL: ${{ inputs.community_url || vars.COMMUNITY_URL || vars.COMMUNITY_TEST_URL || 'https://example.invalid' }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # The obsolete SDK package named "tools" no longer exists.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      # With no hosted backend configured, the APK asks for a test server on first launch.
      - name: Compile, lint, unit-test and build a phone-test APK
        shell: bash
        run: |
          set +e
          gradle -p android :app:lintDebug :app:testDebugUnitTest :app:assembleDebug "-PcommunityUrl=$COMMUNITY_URL" "-PversionCode=$((VERSION_CODE + 100))" --console=plain 2>&1 | tee android-build.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            python3 - <<'PYERROR'
          from pathlib import Path
          log = '\n'.join(Path('android-build.log').read_text().splitlines()[-100:])
          report = Path('android/app/build/reports/lint-results-debug.txt')
          if report.exists(): log += '\n' + report.read_text()[:12000]
          print('::error::' + log.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PYERROR
          fi
          exit "$result"
      # The shareable app: built only when the permanent signing key is stored
      # as repository secrets and COMMUNITY_URL points at the live server.
      - name: Build the signed release APK (members install this one)
        id: release
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.MVPMI_KEYSTORE_BASE64 }}
          MVPMI_KEYSTORE_PASSWORD: ${{ secrets.MVPMI_KEYSTORE_PASSWORD }}
          MVPMI_KEY_ALIAS: ${{ secrets.MVPMI_KEY_ALIAS }}
          MVPMI_KEY_PASSWORD: ${{ secrets.MVPMI_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ "$COMMUNITY_URL" = "https://example.invalid" ]; then
            echo "Release APK skipped: add the signing secrets and the COMMUNITY_URL variable (docs/ANDROID_RELEASE.md)."
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mvpmi-release.jks"
          export MVPMI_KEYSTORE_FILE="$RUNNER_TEMP/mvpmi-release.jks"
          gradle -p android :app:assembleRelease "-PcommunityUrl=$COMMUNITY_URL" "-PversionCode=$((VERSION_CODE + 100))" --console=plain
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/mvpmi.apk
          rm -f "$RUNNER_TEMP/mvpmi-release.jks"
          echo "built=true" >> "$GITHUB_OUTPUT"
      - name: Upload the release APK
        if: steps.release.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mvpmi-release-apk
          path: android/app/build/outputs/apk/release/mvpmi.apk
          retention-days: 30
      - name: Verify APK signature and record checksum
        shell: bash
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          cd android/app/build/outputs/apk/debug
          sha256sum app-debug.apk > SHA256SUMS.txt
          echo "Source commit: $GITHUB_SHA" > BUILD-INFO.txt
          echo "Debug test build only. See docs/PHONE_TESTING.md in the source repository." >> BUILD-INFO.txt
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mvpmi-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
            android/app/build/outputs/apk/debug/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-debug-quality-results
          path: |
            android/app/build/reports/
            android/app/build/outputs/apk/debug/
          retention-days: 7
  publish:
    # Tag pushes (v*) attach the APKs to a permanent GitHub release. Only this
    # job may write to the repository.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: apk
      - name: Publish APKs to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY"; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "MVPMI $TAG" \
              --notes-file .github/release-notes-debug.md
          fi
          files=$(find apk -type f \( -path 'apk/mvpmi-release-apk/*' -o -path 'apk/mvpmi-debug-apk/*' \) || true)
          [ -n "$files" ] || { echo "No APKs were built"; exit 1; }
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" $files --clobber
