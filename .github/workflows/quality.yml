name: Quality checks
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      community_url:
        description: "HTTPS backend URL for a phone-test APK (blank uses repository variable/default)"
        required: false
        type: string
permissions:
  contents: read
jobs:
  server-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # The static-site test serves dist/ (Brotli/gzip copies), so build first.
      - run: npm run build
      - run: mkdir -p test-results && node --experimental-test-coverage --test-coverage-include="server/*.mjs" --test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap --test-reporter-destination=test-results/unit.tap --test tests/*.test.mjs
      # Show each failing unit test as an annotation on the run summary.
      - if: failure()
        run: |
          node -e '
            const t = require("fs").readFileSync("test-results/unit.tap", "utf8").split("\n");
            t.forEach((l, i) => {
              if (!/^\s*not ok/.test(l)) return;
              const msg = t.slice(i, i + 30).join(" ").replace(/\s+/g, " ").slice(0, 900);
              console.log("::error title=Unit test failed::" + msg);
            });'
      # Every screen, button and navigation path of the app, per section
      # (writes test-results/alpha-checklist.md).
      - run: npm run test:e2e
      - run: npm audit --audit-level=moderate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-quality-results
          path: test-results/
          retention-days: 7
  stable-plan:
    # Official release without pushing a tag (this project's tags are made by
    # the pipeline): .github/stable-release names the version (e.g. v1.3.0).
    # On the alpha branch, if that release does not exist yet, the emulator
    # tests run and the signed release is published (job stable-release).
    if: github.event_name == 'push' && github.ref == 'refs/heads/alpha/v1.1-audit'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - id: plan
        shell: bash
        run: |
          TAG=$(tr -d ' \r\n' < .github/stable-release 2>/dev/null || true)
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "No official release requested."; echo "tag=" >> "$GITHUB_OUTPUT"; exit 0; }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG is already published."; echo "tag=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "Official release requested: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
  android:
    # Never package an app from code whose server/browser checks failed.
    needs: [server-and-browser, stable-plan]
    if: always() && needs.server-and-browser.result == 'success' 
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The live server unless a test URL is given (owner, 3 Oct 2026).
      COMMUNITY_URL: ${{ inputs.community_url || vars.COMMUNITY_URL || 'https://samaj.kavigsv.com' }}
      VERSION_CODE: ${{ github.run_number }}
      # v1.2.3 tags become versionName 1.2.3; other builds use the Gradle default.
      VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || needs.stable-plan.outputs.tag || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # The obsolete SDK package named "tools" no longer exists.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      # The server address is built into the APK (no server setting in the app).
      - name: Compile, lint, unit-test and build a phone-test APK
        shell: bash
        run: |
          set +e
          gradle -p android :app:lintDebug :app:testDebugUnitTest :app:assembleDebug "-PcommunityUrl=$COMMUNITY_URL" "-PversionCode=$((VERSION_CODE + 100))" --console=plain 2>&1 | tee android-build.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            python3 - <<'PYERROR'
          from pathlib import Path
          log = '\n'.join(Path('android-build.log').read_text().splitlines()[-100:])
          report = Path('android/app/build/reports/lint-results-debug.txt')
          if report.exists(): log += '\n' + report.read_text()[:12000]
          print('::error::' + log.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PYERROR
          fi
          exit "$result"
      # The shareable app: built only when the permanent signing key is stored
      # as repository secrets and COMMUNITY_URL points at the live server.
      - name: Build the signed release APK (members install this one)
        id: release
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.MVPMI_KEYSTORE_BASE64 }}
          MVPMI_KEYSTORE_PASSWORD: ${{ secrets.MVPMI_KEYSTORE_PASSWORD }}
          MVPMI_KEY_ALIAS: ${{ secrets.MVPMI_KEY_ALIAS }}
          MVPMI_KEY_PASSWORD: ${{ secrets.MVPMI_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ "$COMMUNITY_URL" = "https://example.invalid" ]; then
            echo "Release APK skipped: add the signing secrets and the COMMUNITY_URL variable (docs/ANDROID_RELEASE.md)."
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mvpmi-release.jks"
          export MVPMI_KEYSTORE_FILE="$RUNNER_TEMP/mvpmi-release.jks"
          NAME_ARG=""
          if [ -n "$VERSION_NAME" ]; then NAME_ARG="-PversionName=${VERSION_NAME#v}"; fi
          # APK for sharing by link; AAB (Android App Bundle) for Google Play.
          gradle -p android :app:assembleRelease :app:bundleRelease "-PcommunityUrl=$COMMUNITY_URL" "-PversionCode=$((VERSION_CODE + 100))" $NAME_ARG --console=plain
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk
          mkdir -p release-out
          cp android/app/build/outputs/apk/release/app-release.apk release-out/mvpmi.apk
          cp android/app/build/outputs/bundle/release/app-release.aab release-out/mvpmi-play.aab
          BUILD=$((VERSION_CODE + 100))
          LABEL="${VERSION_NAME:-dev}"
          # Same APK under a name that shows version and build (the download page links it).
          cp release-out/mvpmi.apk "release-out/MVPMI-$LABEL-build$BUILD.apk"
          printf 'Version: %s\nBuild: %s\nServer: %s\nSource commit: %s\nSigned release build (installs over the previous release)\n' "${LABEL#v}" "$BUILD" "$COMMUNITY_URL" "$GITHUB_SHA" > release-out/BUILD-INFO.txt
          (cd release-out && sha256sum mvpmi.apk "MVPMI-$LABEL-build$BUILD.apk" mvpmi-play.aab > SHA256SUMS.txt)
          rm -f "$RUNNER_TEMP/mvpmi-release.jks"
          echo "built=true" >> "$GITHUB_OUTPUT"
      - name: Upload the release APK
        if: steps.release.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mvpmi-release-apk
          path: release-out/
          retention-days: 90
      - name: Verify APK signature and record checksum
        shell: bash
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          cd android/app/build/outputs/apk/debug
          sha256sum app-debug.apk > SHA256SUMS.txt
          echo "Source commit: $GITHUB_SHA" > BUILD-INFO.txt
          echo "Debug test build only. See docs/PHONE_TESTING.md in the source repository." >> BUILD-INFO.txt
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mvpmi-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
            android/app/build/outputs/apk/debug/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-debug-quality-results
          path: |
            android/app/build/reports/
            android/app/build/outputs/apk/debug/
          retention-days: 7
  android-device-tests:
    # On demand, and before every official release (v1.2.3 tags, no "-").
    if: always() && needs.server-and-browser.result == 'success' && (github.event_name == 'workflow_dispatch' || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) || needs.stable-plan.outputs.tag != '' || startsWith(github.ref, 'refs/heads/wip/devtests'))
    # Real instrumented tests (android/app/src/androidTest) on Android
    # emulators for API 29, 33 and 36, against a test server running THIS
    # commit with synthetic data. See docs/ANDROID_DEVICE_TESTS.md.
    needs: [server-and-browser, stable-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 33, 36]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null
      - name: Build the app and the test APK for the emulator
        shell: bash
        run: |
          set +e
          gradle -p android :app:assembleDebug :app:assembleDebugAndroidTest -PcommunityDebugUrl=http://10.0.2.2:3900 "-PversionCode=$(( ${{ github.run_number }} + 100 ))" --console=plain 2>&1 | tee device-build.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            grep -E "^e: |error:|FAILURE|What went wrong" -A3 device-build.log | head -60 | python3 -c "import sys; print('::error title=Device test build failed::' + sys.stdin.read().replace('%','%25').replace('\r','').replace('\n','%0A'))"
          fi
          exit "$result"
      - name: Start the test server (this commit, synthetic data)
        shell: bash
        run: |
          nohup node scripts/android-test-server.mjs 3900 > device-server.log 2>&1 &
          for i in $(seq 1 60); do grep -q "ready" device-server.log && break; sleep 1; done
          cat device-server.log
          grep -q "ready" device-server.log
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the instrumented tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/android-device-tests.sh ${{ matrix.api-level }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-tests-api-${{ matrix.api-level }}
          path: |
            device-test-results/
            device-server.log
          retention-days: 30
  publish:
    # Tag pushes (v*) attach the APKs to a permanent GitHub release. Only this
    # job may write to the repository.
    if: startsWith(github.ref, 'refs/tags/v')
    # An official release is published only after the emulator tests pass.
    needs: [android, android-device-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: apk
      - name: Publish APKs to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY"; then
            # v1.1.0-alpha.1 and similar are pre-releases: they never become
            # "latest", so /download keeps serving the current stable APK.
            pre=""; [[ "$TAG" == *-* ]] && pre="--prerelease"
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" $pre \
              --title "MVPMI $TAG" \
              --notes-file .github/release-notes.md
          fi
          # Members install mvpmi.apk; mvpmi-play.aab is for Google Play.
          files=$(find apk/mvpmi-release-apk -type f 2>/dev/null || true)
          [ -n "$files" ] || { echo "Release build missing: add the signing secrets and COMMUNITY_URL (docs/ANDROID_RELEASE.md)"; exit 1; }
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" $files --clobber

  alpha-release:
    # Alpha pre-release without pushing a tag (owner-approved 2026-09-29):
    # when .github/alpha-release names a tag (for example v1.1.0-alpha.1) and
    # all checks above passed on the alpha branch, this job builds the APK for
    # the live server and publishes it as a GitHub PRE-release (never
    # "latest", so the server's hourly update is not triggered by it).
    if: github.event_name == 'push' && github.ref == 'refs/heads/alpha/v1.1-audit'
    # Released only when the emulator tests passed too (owner, 30 Sep 2026).
    # Emulator tests no longer gate alpha releases (owner tests on his phone).
    needs: [android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      LIVE_URL: https://samaj.kavigsv.com
    steps:
      - uses: actions/checkout@v5
      - name: Which alpha release?
        id: tag
        shell: bash
        run: |
          TAG=$(tr -d ' \r\n' < .github/alpha-release 2>/dev/null || true)
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[a-z]+\.[0-9]+$ ]] || { echo "No alpha tag requested."; echo "tag=" >> "$GITHUB_OUTPUT"; exit 0; }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG is already published."; echo "tag=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - if: steps.tag.outputs.tag != ''
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - if: steps.tag.outputs.tag != ''
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - if: steps.tag.outputs.tag != ''
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build the alpha APK for the live server
        if: steps.tag.outputs.tag != ''
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.MVPMI_KEYSTORE_BASE64 }}
          MVPMI_KEYSTORE_PASSWORD: ${{ secrets.MVPMI_KEYSTORE_PASSWORD }}
          MVPMI_KEY_ALIAS: ${{ secrets.MVPMI_KEY_ALIAS }}
          MVPMI_KEY_PASSWORD: ${{ secrets.MVPMI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null
          TAG="${{ steps.tag.outputs.tag }}"
          ARGS=("-PcommunityUrl=$LIVE_URL" "-PversionName=${TAG#v}" "-PversionCode=$(( ${{ github.run_number }} + 100 ))" --console=plain)
          mkdir -p out
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mvpmi-release.jks"
            export MVPMI_KEYSTORE_FILE="$RUNNER_TEMP/mvpmi-release.jks"
            gradle -p android :app:assembleRelease "${ARGS[@]}"
            cp android/app/build/outputs/apk/release/app-release.apk out/mvpmi.apk
            rm -f "$RUNNER_TEMP/mvpmi-release.jks"
            KIND="Signed release build"
          else
            gradle -p android :app:assembleDebug "${ARGS[@]}"
            cp android/app/build/outputs/apk/debug/app-debug.apk out/mvpmi.apk
            KIND="Test build (debug-signed: uninstall the old app before installing a newer alpha)"
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify out/mvpmi.apk
          BUILD=$(( ${{ github.run_number }} + 100 ))
          printf 'Version: %s\nBuild: %s\nServer: %s\nSource commit: %s\n%s\n' "${TAG#v}" "$BUILD" "$LIVE_URL" "$GITHUB_SHA" "$KIND" > out/BUILD-INFO.txt
          # Same APK under a name that shows version and build (the download page links this name).
          cp out/mvpmi.apk "out/MVPMI-$TAG-build$BUILD.apk"
          (cd out && sha256sum mvpmi.apk "MVPMI-$TAG-build$BUILD.apk" > SHA256SUMS.txt)
      - name: Publish the pre-release
        if: steps.tag.outputs.tag != ''
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          gh release create "$TAG" out/mvpmi.apk out/MVPMI-*.apk out/SHA256SUMS.txt out/BUILD-INFO.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "MVPMI $TAG (alpha)" --notes-file .github/alpha-release-notes.md
  stable-release:
    # Publishes the official, signed release named in .github/stable-release
    # after the emulator tests passed. It becomes GitHub's "latest" release,
    # which the server's hourly update follows automatically.
    needs: [stable-plan, android, android-device-tests]
    if: needs.stable-plan.outputs.tag != '' && needs.android.result == 'success' && needs.android-device-tests.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.stable-plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: mvpmi-release-apk
          path: release-out
      - name: Publish the official release
        shell: bash
        run: |
          set -euo pipefail
          ls -la release-out
          test -f release-out/mvpmi.apk || { echo "::error::Signed release APK missing: check the 4 signing secrets."; exit 1; }
          gh release create "$TAG" release-out/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "વાળા સમાજ $TAG" --notes-file .github/release-notes.md
