name: Quality checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      community_url:
        description: "HTTPS backend URL for a phone-test APK (blank uses repository variable/default)"
        required: false
        type: string
permissions:
  contents: read
jobs:
  server-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run test:ui
      - run: npm run test:embedded
      - run: npm run test:accessibility
      - run: npm run test:language
      - run: npm run test:materials
      - run: npm audit --audit-level=moderate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-quality-results
          path: test-results/
          retention-days: 7
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMMUNITY_URL: ${{ inputs.community_url || vars.COMMUNITY_TEST_URL || 'https://example.invalid' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # The obsolete SDK package named "tools" no longer exists.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      # With no hosted backend configured, the APK asks for a test server on first launch.
      - name: Compile, lint, unit-test and build a phone-test APK
        shell: bash
        run: |
          set +e
          gradle -p android :app:lintDebug :app:testDebugUnitTest :app:assembleDebug "-PcommunityUrl=$COMMUNITY_URL" --console=plain 2>&1 | tee android-build.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            python3 - <<'PYERROR'
          from pathlib import Path
          log = '\n'.join(Path('android-build.log').read_text().splitlines()[-100:])
          report = Path('android/app/build/reports/lint-results-debug.txt')
          if report.exists(): log += '\n' + report.read_text()[:12000]
          print('::error::' + log.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PYERROR
          fi
          exit "$result"
      - name: Verify APK signature and record checksum
        shell: bash
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          cd android/app/build/outputs/apk/debug
          sha256sum app-debug.apk > SHA256SUMS.txt
          echo "Source commit: $GITHUB_SHA" > BUILD-INFO.txt
          echo "Debug test build only. See docs/PHONE_TESTING.md in the source repository." >> BUILD-INFO.txt
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mvpmi-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
            android/app/build/outputs/apk/debug/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-debug-quality-results
          path: |
            android/app/build/reports/
            android/app/build/outputs/apk/debug/
          retention-days: 7
