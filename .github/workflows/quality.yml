name: Quality checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  server-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run test:ui
      - run: npm run test:embedded
      - run: npm run test:accessibility
      - run: npm audit --audit-level=moderate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-quality-results
          path: test-results/
          retention-days: 7
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      # This is a compile/test fixture URL, NOT a working hosted app or release.
      - run: gradle -p android :app:lintDebug :app:testDebugUnitTest :app:assembleDebug -PcommunityUrl=https://example.invalid --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-debug-quality-results
          path: |
            android/app/build/reports/
            android/app/build/outputs/apk/debug/
          retention-days: 7
