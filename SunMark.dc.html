<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>@keyframes smTurn { to { transform:rotate(360deg); } }</style></helmet>
<svg viewBox="-60 -60 120 120" width="100%" height="100%" style="display:block;overflow:visible">
  <defs>
    <radialGradient id="smDisc" cx="34%" cy="26%" r="78%">
      <stop offset="0%" stop-color="#FFE9BE"></stop>
      <stop offset="34%" stop-color="#F3BC6A"></stop>
      <stop offset="68%" stop-color="#E9A13B"></stop>
      <stop offset="100%" stop-color="#B2402C"></stop>
    </radialGradient>
    <linearGradient id="smRay" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#B2402C"></stop>
      <stop offset="42%" stop-color="#E9A13B"></stop>
      <stop offset="100%" stop-color="#FFE1A6"></stop>
    </linearGradient>
    <path id="smFlame" d="M -3.4,-27 C -7.4,-33 1.2,-37.5 -1.6,-45.5 C 4.6,-39.5 8.2,-32 3.4,-27 Z"></path>
    <g id="smRays">
      <use href="#smFlame" transform="rotate(0)"></use>
      <use href="#smFlame" transform="rotate(22.5)"></use>
      <use href="#smFlame" transform="rotate(45)"></use>
      <use href="#smFlame" transform="rotate(67.5)"></use>
      <use href="#smFlame" transform="rotate(90)"></use>
      <use href="#smFlame" transform="rotate(112.5)"></use>
      <use href="#smFlame" transform="rotate(135)"></use>
      <use href="#smFlame" transform="rotate(157.5)"></use>
      <use href="#smFlame" transform="rotate(180)"></use>
      <use href="#smFlame" transform="rotate(202.5)"></use>
      <use href="#smFlame" transform="rotate(225)"></use>
      <use href="#smFlame" transform="rotate(247.5)"></use>
      <use href="#smFlame" transform="rotate(270)"></use>
      <use href="#smFlame" transform="rotate(292.5)"></use>
      <use href="#smFlame" transform="rotate(315)"></use>
      <use href="#smFlame" transform="rotate(337.5)"></use>
    </g>
  </defs>
  <g style="transform-origin:0 0;animation:smTurn 90s linear infinite">
    <use href="#smRays" fill="#E9A13B"></use>
  </g>
  <circle r="27.5" fill="#B2402C" opacity=".9"></circle>
  <circle r="25.5" fill="url(#smDisc)"></circle>
  <ellipse cx="-8" cy="-11" rx="10" ry="5.5" fill="#FFFFFF" opacity=".42" style="filter:blur(2px)"></ellipse>
</svg>

</x-dc>
</body>
</html>
